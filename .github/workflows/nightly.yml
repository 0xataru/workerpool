name: Nightly stress

# The stress tests are randomised, so every run explores schedules the last one
# did not. A single run in CI is a smoke check; the value comes from repeating it
# far more often than a pull request can afford to wait for.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gomaxprocs: [1, 2, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A failing run prints its seed, which is what makes it reproducible.
      - name: deep stress
        run: go test -race -count=100 -timeout 60m -run Stress -v ./...
        env:
          GOMAXPROCS: ${{ matrix.gomaxprocs }}

      - name: full suite, repeated
        run: go test -race -count=10 -timeout 60m ./...
        env:
          GOMAXPROCS: ${{ matrix.gomaxprocs }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release plus the current one: the go directive in
        # go.mod is a promise, so it has to keep being tested.
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

  # A concurrency bug that only shows up on one core will never appear in the job
  # above, which runs on whatever the runner happens to have. Pinning GOMAXPROCS
  # forces genuinely different schedules.
  gomaxprocs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gomaxprocs: [1, 2, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: test
        run: go test -race -count=1 ./...
        env:
          GOMAXPROCS: ${{ matrix.gomaxprocs }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Not stable: staticcheck lags each Go release, and 2026.2.1 cannot read
      # Go 1.27 export data. Move this forward once a staticcheck release can.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # Run via go run so the linter never becomes a dependency of the module.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

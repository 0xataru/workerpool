name: Bug report
description: Something does not behave as the README or the docs say it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small program or test that shows the problem. For races or hangs, include the -race output or a goroutine dump if you have one.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: workerpool version
      placeholder: v0.0.3
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: go version
      description: Output of `go version`, plus GOMAXPROCS if you set it.
      placeholder: go1.24.0 linux/amd64
    validations:
      required: true
